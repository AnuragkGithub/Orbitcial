<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Core Sphere Gradient -->
    <radialGradient id="sphereGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e0e7ff" />
      <stop offset="70%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4338ca" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ambient Glow Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" stroke-dasharray="6 8" />

  <!-- 3D Orbital Ellipse Back Half -->
  <g transform="rotate(-30 256 256)">
    <path d="M 66 256 A 190 65 0 0 1 446 256" fill="none" stroke="url(#ringGrad)" stroke-width="14" stroke-linecap="round" opacity="0.5" />
    
    <!-- Central Celestial Core -->
    <circle cx="256" cy="256" r="95" fill="url(#sphereGrad)" filter="url(#glow)" />
    
    <!-- Inner Orbit Symbol "o" -->
    <circle cx="256" cy="256" r="50" fill="none" stroke="#ffffff" stroke-width="18" opacity="0.95" />

    <!-- 3D Orbital Ellipse Front Half (Passing in front of the sphere) -->
    <path d="M 446 256 A 190 65 0 0 1 66 256" fill="none" stroke="url(#ringGrad)" stroke-width="16" stroke-linecap="round" />

    <!-- Satellite Planet Node -->
    <circle cx="410" cy="285" r="18" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="410" cy="285" r="10" fill="#ffffff" />

    <circle cx="102" cy="227" r="12" fill="#f43f5e" filter="url(#glow)" />
    <circle cx="102" cy="227" r="6" fill="#ffffff" />
  </g>

  <!-- Sparkle Star Accent -->
  <path d="M 390 110 Q 390 130 410 130 Q 390 130 390 150 Q 390 130 370 130 Q 390 130 390 110 Z" fill="#ffffff" opacity="0.85" />
</svg>
